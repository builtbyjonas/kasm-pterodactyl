name: Bug Report
description: Create a report to help us improve the Pterodactyl Kasm integration
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please be as detailed as possible to help us reproduce your issue.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / Docker Version
      placeholder: e.g. Ubuntu 22.04 / Docker 24.0.5
    validations:
      required: true
  - type: input
    id: wings
    attributes:
      label: Pterodactyl Wings Version
      placeholder: e.g. v1.11.8
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here (e.g. Container logs).
