name: Build and Push Docker Image

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
    paths:
      - 'docker/Dockerfile'
      - 'docker/entrypoint.sh'
  pull_request:
    branches:
      - main
    paths:
      - 'docker/Dockerfile'
      - 'docker/entrypoint.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/builtbyjonas/kasm-pterodactyl:latest
          cache-from: type=registry,ref=ghcr.io/builtbyjonas/kasm-pterodactyl:buildcache
          cache-to: type=registry,ref=ghcr.io/builtbyjonas/kasm-pterodactyl:buildcache,mode=max
